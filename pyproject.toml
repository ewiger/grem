[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grem-ai"
version = "0.3.0"
description = "Deterministic project bootstrap and control CLI for AI-assisted development: grem stamps structure, agents do the work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yauhen Yakimovich", email = "yauhen.yakimovich.mail@gmail.com" }]
keywords = ["scaffolding", "template", "ai-agents", "cli", "codegen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pyperclip>=1.11.0",
    "pyyaml>=6.0",
    "semver>=3.0,<4",
    "typer>=0.15",
]

[project.scripts]
grem = "grem.cli:app"

[project.urls]
Homepage = "https://github.com/ewiger/grem"
Repository = "https://github.com/ewiger/grem"
Issues = "https://github.com/ewiger/grem/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grem = [
    "templates/*/content/*",
    "templates/*/content/**/*",
    "templates/*/content/.gitignore",
    "templates/*/content/.gremignore",
    "templates/*/content/.grem/*",
    "templates/*/content/.grem/**/*",
    "templates/*/content/.claude/*",
    "templates/*/content/.claude/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
    "*.pyo",
    "__pycache__/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
