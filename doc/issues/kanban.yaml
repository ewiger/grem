# Kanban board — the index of doc/issues/.
#
# Top-level keys are the columns (swimlanes); top to bottom is the flow. Each
# holds an ordered list of issue cards, highest priority first. Move a card
# between columns as work progresses. When an issue is Done and no longer
# relevant, archive its file to .grem/issues/archive/ and delete its card here.
#
# Convention: doc/wiki/kanban.hmd

board:
  title: "doc/issues/ Kanban board",
  description: "The index of doc/issues/.",
  columns: [
    { name: "backlog", description: "Issues that are not yet prioritized." },
    { name: "todo", description: "Issues that are prioritized and ready to work on." },
    { name: "doing", description: "Issues that are currently being worked on." },
    { name: "done", description: "Issues that have been completed." }
  ]
  last_id: 1 # to be incremented when adding a new issue card
  items:
    backlog: []

    todo:
      - id: "0001"
        title: Incomplete init and upgrade
        file: 0001-incomplete-init-and-upgrade.md

    doing: []

    done: []
